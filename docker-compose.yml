services:

  mysql:
    image: mysql:8.4
    container_name: employee-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee_db}
      MYSQL_USER: ${MYSQL_USER:-employee_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-employeepassword}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: employee-app

    ports:
      - "80:80"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-employee_db}
      DB_USER: ${DB_USER:-employee_user}
      DB_PASSWORD: ${DB_PASSWORD:-employeepassword}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

volumes:
  mysql_data:
