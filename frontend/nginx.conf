server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # React application
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------
    # GZIP COMPRESSION
    # --------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    gzip_min_length 1000;

    # --------------------------------------------------
    # STATIC ASSETS
    # --------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------
    # Frontend calls:
    #   /api/...
    #
    # Nginx forwards to:
    #   Flask/Gunicorn on port 5000
    #
    # ACI multi-container group shares the network namespace,
    # so 127.0.0.1:5000 reaches the backend container.
    #
    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        # Forward request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------
    # REACT SPA ROUTING
    # --------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------
    # SECURITY
    # --------------------------------------------------
    # Prevent access to hidden files such as:
    # .env
    # .git
    # .gitignore
    #
    # Exception: .well-known is allowed.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
